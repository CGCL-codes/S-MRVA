[pytest]
# The analyzer suites are the artifact's self-contained tests. Restricting
# discovery here keeps `pytest` from collecting the vendored CodeQL test corpus
# under data/codeql/ (those files are analyzer fixtures, not our tests).
testpaths =
    src/analyzers
pythonpath =
    src
    src/analyzers
addopts = -ra
markers =
    integration: requires a funded LLM API key (skipped when unset)
